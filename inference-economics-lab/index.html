<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inference Economics Lab</title>
  <style>
    :root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f14;color:#edf2ed;font:16px/1.5 system-ui,sans-serif}.loader{max-width:36rem;padding:2rem;text-align:center}.bar{height:4px;margin-top:1rem;overflow:hidden;border-radius:99px;background:#25303a}.bar:after{content:"";display:block;width:45%;height:100%;background:#c9ff72;animation:load 1.1s infinite ease-in-out}@keyframes load{from{transform:translateX(-110%)}to{transform:translateX(250%)}}.error{color:#ff9e80;white-space:pre-wrap}
  </style>
</head>
<body>
  <main class="loader"><h1>Inference Economics Lab</h1><p id="status">Loading the interactive lab…</p><div class="bar" aria-hidden="true"></div></main>
  <script>
    (async()=>{
      const files=Array.from({length:12},(_,i)=>`payload-${String(i).padStart(2,'0')}.txt`);
      try{
        const responses=await Promise.all(files.map(f=>fetch(f,{cache:'no-cache'})));
        const failed=responses.find(r=>!r.ok);
        if(failed)throw new Error(`Could not load ${failed.url}: HTTP ${failed.status}`);
        const html=(await Promise.all(responses.map(r=>r.text()))).join('');
        document.open();document.write(html);document.close();
      }catch(error){
        document.querySelector('.bar')?.remove();
        const status=document.getElementById('status');status.className='error';status.textContent=`The site payload could not be loaded.\n${error.message}`;
      }
    })();
  </script>
</body>
</html>
